name: CI

on:
  push:
    paths-ignore:
      - README.md
      - .gitignore
      - .gitattributes
      - .editorconfig

  workflow_dispatch:
  workflow_call:

jobs:
  build-cmake:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # https://cmake.org/cmake/help/latest/variable/CMAKE_SYSTEM_NAME.html#variable:CMAKE_SYSTEM_NAME
        include:
          - plat-name: Linux
            os: ubuntu-latest
          - plat-name: Windows
            os: windows-latest
          - plat-name: Darwin
            os: macos-latest
    
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup environment
        uses: ./.github/workflows/setup.yml
        with:
          platform: ${{ matrix.os }}
        
      - name: Build
        run: |
          cmake -G Ninja --preset=Default -DXREPO_PACKAGE_DISABLE=ON
          ninja -C build/cmake/${{ matrix.plat-name }}

  build-xmake:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup environment
        uses: ./.github/workflows/setup.yml
        with:
          platform: ${{ matrix.os }}

      - name: Build (Web)
        run: |
          xmake f -y -vD -p wasm --toolchain=emcc
          xmake b -vD
        
      - name: Build (native)
        run: |
          xmake f -c
          xmake b -vD
