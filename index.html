<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            #canvas {
                position: absolute;
                top: 0px;
                left: 0px;
                margin: 0px;
                border: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;
            }
        </style>
    </head>

    <body>
        <canvas id="canvas" oncontextmenu="event.preventDefault();"></canvas>

        <script>
            Module = {
                "canvas": document.getElementById("canvas")
            };
        </script>
        <script async type="text/javascript" src="siteInit.js"></script>
    </body>
</html>
