<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script type="module" src="https://unpkg.com/@spiritov/ds.css/dist/widgets/ds-calendar.js"></script>
        <script type="module" src="https://unpkg.com/@spiritov/ds.css/dist/widgets/ds-clock.js"></script>

        <link rel="stylesheet" href="https://unpkg.com/@spiritov/ds.css" />
        <link href="./style/style.css" rel="stylesheet" />
        <link href="./style/backtotop.css" rel="stylesheet" />
    </head>

    <body class="ds-css">
        <div class="top">
            <canvas id="canvas"></canvas>
        </div>

        <div class="flex place-content-center ds-grid"
             style="padding: 16px">
            <ds-clock></ds-clock>
            <ds-calendar></ds-calendar>
            <div class="pictochat-message">
                <span>
                    Made by lebao3105 with efforts<br>
                    and many other great projects!<br>
                    Source code and issue tracker can be found 
                    <a href="https://github.com/lebao3105/lebao3105.github.io">here</a>.
                </span>
            </div>
        </div>

        <a id="back-to-top" href="#top" hidden="true">
            <i>UP</i>
        </a>

        <script>
            Module = {
                "printWithColors": false,
                "locateFile": function(path, prefix) {
                    if (prefix === '') {
                        prefix = location.origin + '/js/';
                    }
                    return prefix + path;
                },
                "canvas": document.getElementById("canvas")
            };

            var backToTop = document.getElementById("back-to-top");

            function onViewportChange(_) {
                console.log("window.pageYOffset = ", window.pageYOffset);
                backToTop.hidden = window.pageYOffset < 150;
            }

            window.onscroll = onViewportChange;
            window.onresize = onViewportChange;
        </script>
        <script async type="text/javascript" src="js/siteInit.js"></script>
    </body>
</html>
